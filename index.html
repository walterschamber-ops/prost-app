const PHONE = "5492954532941"; // ⚠️ Número de PRUEBA — volver a "5492657640911" cuando termines de probar

const money = (n) => n.toLocaleString("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });

// Paleta central — todo el color de la app vive acá
const C = {
  bg: "#1c1410",
  panel: "#241a13",
  border: "#3a2e22",
  cream: "#f2e8d5",
  creamPanel: "#e9ddc4",
  creamPanel2: "#e5d8bd",
  creamBorder: "#d9cbb0",
  gold: "#c8952a",
  rust: "#8b3a2f",
  green: "#4a5d42",
  muted: "#8a7a68",
  dark: "#1c1410",
  disabled: "#b9b3a3",
};

const oswald = { fontFamily: "'Oswald', sans-serif" };

function App() {
  const [cart, setCart] = useState({}); // { [skuKey]: qty }
  const [cartOpen, setCartOpen] = useState(false);
  const [mode, setMode] = useState("bar"); // "bar" | "delivery"
  const [address, setAddress] = useState("");
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [payment, setPayment] = useState(null); // "qr" | "alias" | "efectivo"
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [lastOrderNumber, setLastOrderNumber] = useState(null);

  // Panel del encargado
  const [view, setView] = useState("menu"); // "menu" | "adminGate" | "admin"
  const [codeInput, setCodeInput] = useState("");
  const [codeError, setCodeError] = useState(false);
  const [orders, setOrders] = useState([]);
  const [ordersLoading, setOrdersLoading] = useState(false);

  // Carga la lista de pedidos guardados (compartida entre todos los que usan la app)
  const loadOrders = async () => {
    try {
      const res = await window.storage.get("orders_log", true);
      return res && res.value ? JSON.parse(res.value) : [];
    } catch {
      return [];
    }
  };
  const saveOrders = async (list) => {
    try {
      await window.storage.set("orders_log", JSON.stringify(list), true);
    } catch {
      // si falla el guardado, el pedido igual se manda por WhatsApp
    }
  };

  const openAdminPanel = async () => {
    setOrdersLoading(true);
    const list = await loadOrders();
    setOrders(list);
    setOrdersLoading(false);
    setView("admin");
  };

  const checkCode = () => {
    if (codeInput.trim() === ADMIN_CODE) {
      setCodeError(false);
      setCodeInput("");
      openAdminPanel();
    } else {
      setCodeError(true);
    }
  };

  const downloadCSV = () => {
    const header = "Pedido,Fecha,Hora,Cliente,Celular,Entrega,Direccion,Pago,Items,Subtotal\n";
    const rows = orders
      .map((o) =>
        [
          o.number,
          o.dateLabel,
          o.timeLabel,
          o.customer,
          o.customerPhone || "",
          o.mode === "delivery" ? "Delivery" : "Retiro",
          o.address || "",
          o.payment,
          o.items,
          o.subtotal,
        ]
          .map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`)
          .join(",")
      )
      .join("\n");
    const blob = new Blob([header + rows], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "pedidos_prost.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // Lista plana de SKUs (producto + variante) para buscar por key en el carrito
  const skuMap = useMemo(() => {
    const map = {};
    MENU.forEach((cat) => {
      cat.items.forEach((item) => {
        item.variants.forEach((v, i) => {
          const key = `${item.id}__${i}`;
          map[key] = {
            key,
            displayName: item.variants.length > 1 ? `${item.name} (${v.label})` : item.name,
            unitLabel: v.label,
            price: v.price,
          };
        });
      });
    });
    return map;
  }, []);

  const add = (key) => setCart((c) => ({ ...c, [key]: (c[key] || 0) + 1 }));
  const remove = (key) =>
    setCart((c) => {
      const n = { ...c };
      if (!n[key]) return n;
      n[key] -= 1;
      if (n[key] <= 0) delete n[key];
      return n;
    });

  const cartLines = Object.entries(cart)
    .map(([key, qty]) => ({ sku: skuMap[key], qty }))
    .filter((l) => l.sku);

  const subtotal = cartLines.reduce((s, l) => s + l.sku.price * l.qty, 0);
  const totalItems = cartLines.reduce((s, l) => s + l.qty, 0);

  const canSend = cartLines.length > 0 && name.trim() && phone.trim() && payment && (mode === "bar" || address.trim());

  const sendOrder = async () => {
    if (!canSend || sending) return;
    setSending(true);

    const now = new Date();
    let orderNumber = null;
    try {
      const list = await loadOrders();
      orderNumber = list.length + 1;
      const record = {
        number: orderNumber,
        dateTime: now.toISOString(),
        dateLabel: now.toLocaleDateString("es-AR"),
        timeLabel: now.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }),
        customer: name,
        customerPhone: phone,
        mode,
        address: mode === "delivery" ? address : "",
        payment: PAYMENT_METHODS.find((p) => p.id === payment)?.label || "",
        items: cartLines.map((l) => `${l.qty}x ${l.sku.displayName}`).join(" | "),
        subtotal,
      };
      list.push(record);
      await saveOrders(list);
    } catch {
      orderNumber = null; // si falla el guardado, el pedido se manda igual, sin número
    }

    const orderTag = orderNumber ? `Pedido #${String(orderNumber).padStart(4, "0")}\n` : "";
    const lines = cartLines.map((l) => `• ${l.qty}x ${l.sku.displayName} — ${money(l.sku.price * l.qty)}`).join("\n");
    const addrText = mode === "delivery" ? `\n📍 Dirección: ${address}` : "";
    const deliveryNote = mode === "delivery" ? "\n🛵 Delivery — *a coordinar costo de envío*" : "\n🏠 Retira en el bar";
    const paymentLabel = PAYMENT_METHODS.find((p) => p.id === payment)?.label || "";
    const msg =
      `🍺 *Nuevo pedido - Prost!*\n${orderTag}\n` +
      `👤 Cliente: ${name}\n` +
      `📱 Tel: ${phone}` +
      deliveryNote +
      addrText +
      `\n\n*Pedido:*\n${lines}\n\n` +
      `Subtotal: ${money(subtotal)}` +
      (mode === "delivery" ? `\n_(el total final incluye el envío a confirmar)_` : `\n*Total: ${money(subtotal)}*`) +
      `\n💳 Pago: *${paymentLabel}*`;
    window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`, "_blank");
    setLastOrderNumber(orderNumber);
    setSending(false);
    setSent(true);
  };

  if (view === "adminGate") {
    return (
      <div className="min-h-screen flex items-center justify-center p-6" style={{ backgroundColor: C.bg }}>
        <div className="rounded-2xl p-8 max-w-sm w-full border-4" style={{ backgroundColor: C.cream, borderColor: C.gold }}>
          <div className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4" style={{ backgroundColor: C.panel }}>
            <span style={{ fontSize: 26 }}>🔒</span>
          </div>
          <h2 className="text-xl mb-1 tracking-wide text-center" style={{ ...oswald, color: C.dark }}>PANEL DEL ENCARGADO</h2>
          <p className="text-sm mb-4 text-center" style={{ color: C.muted }}>Ingresá el código de acceso</p>
          <input
            type="password"
            value={codeInput}
            onChange={(e) => {
              setCodeInput(e.target.value);
              setCodeError(false);
            }}
            onKeyDown={(e) => e.key === "Enter" && checkCode()}
            placeholder="Código"
            className="w-full rounded-lg px-3 py-2.5 text-sm outline-none border mb-2"
            style={{ backgroundColor: "white", borderColor: codeError ? C.rust : C.creamBorder, color: C.dark }}
          />
          {codeError && <p className="text-xs mb-2" style={{ color: C.rust }}>Código incorrecto.</p>}
          <button
            onClick={checkCode}
            className="w-full py-3 rounded-lg tracking-wide mb-2"
            style={{ ...oswald, backgroundColor: C.green, color: "white" }}
          >
            ENTRAR
          </button>
          <button onClick={() => setView("menu")} className="w-full py-2 text-sm" style={{ color: C.muted }}>
            Volver a la carta
          </button>
        </div>
      </div>
    );
  }

  if (view === "admin") {
    const sorted = [...orders].sort((a, b) => b.number - a.number);
    return (
      <div className="min-h-screen" style={{ backgroundColor: C.bg }}>
        <header className="px-5 pt-8 pb-5 flex items-center justify-between border-b-4" style={{ borderColor: C.gold }}>
          <button onClick={() => setView("menu")} style={{ color: C.cream }}><span style={{ fontSize: 20 }}>←</span></button>
          <h1 className="text-lg tracking-wide" style={{ ...oswald, color: C.cream }}>PEDIDOS</h1>
          <button onClick={openAdminPanel} style={{ color: C.gold }}><span style={{ fontSize: 18 }}>🔄</span></button>
        </header>

        <div className="p-4 max-w-lg mx-auto">
          <button
            onClick={downloadCSV}
            disabled={orders.length === 0}
            className="w-full flex items-center justify-center gap-2 rounded-lg py-3 mb-4 tracking-wide"
            style={{ ...oswald, backgroundColor: orders.length ? C.gold : C.disabled, color: C.dark }}
          >
            <span style={{ fontSize: 16 }}>⬇️</span> DESCARGAR CSV
          </button>

          {ordersLoading ? (
            <p className="text-sm text-center py-8" style={{ color: C.muted }}>Cargando pedidos...</p>
          ) : sorted.length === 0 ? (
            <p className="text-sm text-center py-8" style={{ color: C.muted }}>Todavía no hay pedidos registrados.</p>
          ) : (
            <div className="space-y-2">
              {sorted.map((o) => (
                <div key={o.number} className="rounded-xl p-3.5 border" style={{ backgroundColor: C.panel, borderColor: C.border }}>
                  <div className="flex items-center justify-between mb-1">
                    <span className="text-sm" style={{ ...oswald, color: C.gold }}>#{String(o.number).padStart(4, "0")}</span>
                    <span className="text-xs" style={{ color: C.muted }}>{o.dateLabel} · {o.timeLabel}</span>
                  </div>
                  <p className="text-sm font-medium" style={{ color: C.cream }}>{o.customer}{o.customerPhone ? ` · ${o.customerPhone}` : ""}</p>
                  <p className="text-xs mt-0.5" style={{ color: C.muted }}>
                    {o.mode === "delivery" ? `Delivery${o.address ? " — " + o.address : ""}` : "Retiro en el bar"} · {o.payment}
                  </p>
                  <p className="text-xs mt-1" style={{ color: C.muted }}>{o.items}</p>
                  <p className="text-sm mt-1" style={{ ...oswald, color: C.cream }}>{money(o.subtotal)}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  if (sent) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6" style={{ backgroundColor: C.bg }}>
        <div className="rounded-2xl p-8 max-w-sm w-full text-center border-4" style={{ backgroundColor: C.cream, borderColor: C.gold }}>
          <div className="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4" style={{ backgroundColor: C.green }}>
            <span style={{ fontSize: 32 }}>✅</span>
          </div>
          <h2 className="text-2xl mb-2 tracking-wide" style={{ ...oswald, color: C.dark }}>
            PEDIDO ENVIADO{lastOrderNumber ? ` #${String(lastOrderNumber).padStart(4, "0")}` : ""}
          </h2>
          <p className="text-sm mb-6" style={{ color: "#5a4a3a" }}>
            Te abrimos WhatsApp con tu pedido listo para mandar.{" "}
            {mode === "delivery" ? "El bar te va a confirmar el costo del envío y el total por ahí." : "Cualquier cosa, el bar te confirma por ahí."}
          </p>
          <button
            onClick={() => {
              setSent(false);
              setCart({});
              setMode("bar");
              setAddress("");
              setName("");
              setPhone("");
              setPayment(null);
              setLastOrderNumber(null);
            }}
            className="w-full py-3 rounded-lg tracking-wide"
            style={{ ...oswald, backgroundColor: C.rust, color: C.cream }}
          >
            HACER OTRO PEDIDO
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen" style={{ backgroundColor: C.bg, fontFamily: "'Inter', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
      `}</style>

      {/* Header */}
      <header className="px-5 pt-8 pb-6 text-center relative overflow-hidden border-b-4" style={{ borderColor: C.gold }}>
        <div className="mx-auto mb-2 relative" style={{ fontSize: 36 }}>🍺</div>
        <h1 className="text-4xl tracking-widest relative" style={{ ...oswald, color: C.cream }}>PROST!</h1>
        <p className="text-xs tracking-widest mt-1 relative" style={{ color: C.gold }}>CARTA & PEDIDOS</p>
      </header>

      {/* Menu */}
      <main className="px-4 py-6 max-w-lg mx-auto" style={{ paddingBottom: "8rem" }}>
        {MENU.map((cat) => (
          <section key={cat.category} className="mb-7">
            <div className="flex items-center gap-3 mb-3">
              <h2 className="text-lg tracking-wide uppercase" style={{ ...oswald, color: C.gold }}>{cat.category}</h2>
              <div className="flex-1 h-px" style={{ backgroundColor: C.border }} />
            </div>
            <div className="space-y-2">
              {cat.items.map((item) => (
                <div
                  key={item.id}
                  className="rounded-xl p-3.5 border"
                  style={{ backgroundColor: C.panel, borderColor: C.border }}
                >
                  <p className="font-semibold text-sm" style={{ color: C.cream }}>{item.name}</p>
                  {item.desc && <p className="text-xs mt-0.5 mb-2" style={{ color: C.muted }}>{item.desc}</p>}
                  {!item.desc && <div className="mb-2" />}

                  <div className="space-y-1.5">
                    {item.variants.map((v, i) => {
                      const key = `${item.id}__${i}`;
                      const qty = cart[key] || 0;
                      return (
                        <div key={key} className="flex items-center justify-between gap-3">
                          <div className="text-xs" style={{ color: C.gold }}>
                            {item.variants.length > 1 && <span style={{ color: C.muted }}>{v.label} · </span>}
                            <span style={oswald}>{money(v.price)}</span>
                          </div>
                          {qty === 0 ? (
                            <button
                              onClick={() => add(key)}
                              className="shrink-0 rounded-lg px-3 py-1.5 text-xs tracking-wide"
                              style={{ ...oswald, backgroundColor: C.rust, color: C.cream }}
                            >
                              AGREGAR
                            </button>
                          ) : (
                            <div className="shrink-0 flex items-center gap-2 rounded-lg px-1" style={{ backgroundColor: C.border }}>
                              <button onClick={() => remove(key)} className="p-1.5" style={{ color: C.cream }}><span style={{ fontSize: 16, lineHeight: 1 }}>−</span></button>
                              <span className="text-sm w-4 text-center" style={{ color: C.cream }}>{qty}</span>
                              <button onClick={() => add(key)} className="p-1.5" style={{ color: C.cream }}><span style={{ fontSize: 16, lineHeight: 1 }}>+</span></button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </section>
        ))}

        <button
          onClick={() => setView("adminGate")}
          className="w-full text-center py-4 text-xs"
          style={{ color: C.border }}
        >
          Panel del encargado
        </button>
      </main>

      {/* Floating cart bar */}
      {totalItems > 0 && !cartOpen && (
        <button
          onClick={() => setCartOpen(true)}
          className="fixed bottom-4 left-4 right-4 max-w-lg mx-auto rounded-xl py-3.5 px-5 flex items-center justify-between shadow-lg tracking-wide"
          style={{ ...oswald, backgroundColor: C.gold, color: C.dark }}
        >
          <span className="flex items-center gap-2"><span style={{ fontSize: 18 }}>🛒</span> {totalItems} {totalItems === 1 ? "ITEM" : "ITEMS"}</span>
          <span>{money(subtotal)}</span>
        </button>
      )}

      {/* Cart / checkout drawer */}
      {cartOpen && (
        <div className="fixed inset-0 z-50 flex items-end">
          <div className="absolute inset-0" style={{ backgroundColor: "rgba(0,0,0,0.6)" }} onClick={() => setCartOpen(false)} />
          <div
            className="relative w-full max-w-lg mx-auto rounded-t-2xl overflow-y-auto"
            style={{ backgroundColor: C.cream, maxHeight: "88vh" }}
          >
            <div className="sticky top-0 px-5 py-4 flex items-center justify-between border-b" style={{ backgroundColor: C.cream, borderColor: C.creamBorder }}>
              <h3 className="text-lg tracking-wide" style={{ ...oswald, color: C.dark }}>TU PEDIDO</h3>
              <button onClick={() => setCartOpen(false)} style={{ color: C.dark }}><span style={{ fontSize: 20 }}>✕</span></button>
            </div>

            <div className="px-5 py-4 space-y-3">
              {cartLines.length === 0 ? (
                <p className="text-sm text-center py-6" style={{ color: C.muted }}>Todavía no agregaste nada.</p>
              ) : (
                cartLines.map((l) => (
                  <div key={l.sku.key} className="flex items-center justify-between">
                    <div>
                      <p className="text-sm font-medium" style={{ color: C.dark }}>{l.sku.displayName}</p>
                      <p className="text-xs" style={{ color: C.muted }}>{money(l.sku.price)} c/u</p>
                    </div>
                    <div className="flex items-center gap-2 rounded-lg px-1" style={{ backgroundColor: C.creamPanel2 }}>
                      <button onClick={() => remove(l.sku.key)} className="p-1.5" style={{ color: C.dark }}><span style={{ fontSize: 16, lineHeight: 1 }}>−</span></button>
                      <span className="text-sm w-4 text-center" style={{ color: C.dark }}>{l.qty}</span>
                      <button onClick={() => add(l.sku.key)} className="p-1.5" style={{ color: C.dark }}><span style={{ fontSize: 16, lineHeight: 1 }}>+</span></button>
                    </div>
                  </div>
                ))
              )}
            </div>

            {cartLines.length > 0 && (
              <>
                <div className="px-5 py-4 border-t space-y-3" style={{ borderColor: C.creamBorder }}>
                  <label className="block text-xs tracking-wide mb-1" style={{ ...oswald, color: "#5a4a3a" }}>TU NOMBRE</label>
                  <input
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="¿A nombre de quién?"
                    className="w-full rounded-lg px-3 py-2.5 text-sm outline-none border"
                    style={{ backgroundColor: "white", borderColor: C.creamBorder, color: C.dark }}
                  />

                  <label className="block text-xs tracking-wide mb-1 mt-3" style={{ ...oswald, color: "#5a4a3a" }}>TU CELULAR</label>
                  <input
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    placeholder="Ej: 2657 123456"
                    type="tel"
                    className="w-full rounded-lg px-3 py-2.5 text-sm outline-none border"
                    style={{ backgroundColor: "white", borderColor: C.creamBorder, color: C.dark }}
                  />

                  <label className="block text-xs tracking-wide mb-1 mt-3" style={{ ...oswald, color: "#5a4a3a" }}>ENTREGA</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={() => {
                        setMode("bar");
                        setAddress("");
                      }}
                      className="rounded-lg px-3 py-2.5 text-xs font-medium text-left border flex items-center gap-2"
                      style={
                        mode === "bar"
                          ? { backgroundColor: C.green, color: "white", borderColor: C.green }
                          : { backgroundColor: "white", color: C.dark, borderColor: C.creamBorder }
                      }
                    >
                      <span style={{ fontSize: 14 }}>🏠</span>
                      <span>Retiro en el bar<br /><span style={{ opacity: 0.8 }}>Gratis</span></span>
                    </button>
                    <button
                      onClick={() => setMode("delivery")}
                      className="rounded-lg px-3 py-2.5 text-xs font-medium text-left border flex items-center gap-2"
                      style={
                        mode === "delivery"
                          ? { backgroundColor: C.green, color: "white", borderColor: C.green }
                          : { backgroundColor: "white", color: C.dark, borderColor: C.creamBorder }
                      }
                    >
                      <span style={{ fontSize: 14 }}>📍</span>
                      <span>Delivery<br /><span style={{ opacity: 0.8 }}>A coordinar</span></span>
                    </button>
                  </div>

                  {mode === "delivery" && (
                    <div className="mt-2 space-y-2">
                      <input
                        value={address}
                        onChange={(e) => setAddress(e.target.value)}
                        placeholder="Dirección completa (calle, número, referencia)"
                        className="w-full rounded-lg px-3 py-2.5 text-sm outline-none border"
                        style={{ backgroundColor: "white", borderColor: C.creamBorder, color: C.dark }}
                      />
                      <p className="text-xs" style={{ color: C.muted }}>
                        El costo del envío te lo confirma el bar por WhatsApp según tu zona.
                      </p>
                    </div>
                  )}

                  <label className="block text-xs tracking-wide mb-1 mt-3" style={{ ...oswald, color: "#5a4a3a" }}>MEDIO DE PAGO</label>
                  <div className="grid grid-cols-3 gap-2">
                    {PAYMENT_METHODS.map((p) => {
                      const active = payment === p.id;
                      return (
                        <button
                          key={p.id}
                          onClick={() => setPayment(p.id)}
                          className="rounded-lg px-2 py-2.5 text-xs font-medium border flex flex-col items-center gap-1"
                          style={
                            active
                              ? { backgroundColor: C.green, color: "white", borderColor: C.green }
                              : { backgroundColor: "white", color: C.dark, borderColor: C.creamBorder }
                          }
                        >
                          <span style={{ fontSize: 18 }}>{p.emoji}</span>
                          {p.label}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="px-5 py-4 border-t space-y-1.5" style={{ borderColor: C.creamBorder, backgroundColor: C.creamPanel }}>
                  <div className="flex justify-between text-sm" style={{ color: "#5a4a3a" }}>
                    <span>Subtotal</span><span>{money(subtotal)}</span>
                  </div>
                  <div className="flex justify-between text-lg pt-1" style={{ ...oswald, color: C.dark }}>
                    <span>{mode === "delivery" ? "SUBTOTAL (+ envío)" : "TOTAL"}</span>
                    <span>{money(subtotal)}</span>
                  </div>
                  {mode === "delivery" && (
                    <p className="text-xs pt-0.5" style={{ color: C.muted }}>
                      El envío se suma después, según lo confirme el bar.
                    </p>
                  )}
                </div>

                <div className="px-5 py-4">
                  <button
                    onClick={sendOrder}
                    disabled={!canSend || sending}
                    className="w-full py-3.5 rounded-lg tracking-wide flex items-center justify-center gap-2"
                    style={{
                      ...oswald,
                      backgroundColor: canSend && !sending ? C.green : C.disabled,
                      color: "white",
                      cursor: canSend && !sending ? "pointer" : "not-allowed",
                    }}
                  >
                    {sending ? "ENVIANDO..." : "ENVIAR PEDIDO POR WHATSAPP"}
                  </button>
                  {!canSend && (
                    <p className="text-xs text-center mt-2" style={{ color: C.muted }}>
                      {!name.trim()
                        ? "Completá tu nombre"
                        : !phone.trim()
                        ? "Completá tu celular"
                        : mode === "delivery" && !address.trim()
                        ? "Completá la dirección"
                        : !payment
                        ? "Elegí un medio de pago"
                        : "Completá los datos"}{" "}
                      para continuar
                    </p>
                  )}
                </div>
              </>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
